name: Update weekly Shabbat information

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-shabbat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Retrieve current Bologna Shabbat information
        run: node scripts/update-shabbat.mjs

      - name: Publish changes when needed
        run: |
          if git diff --quiet -- data/shabbat.json; then
            echo "Shabbat information is already current."
            exit 0
          fi
          git config user.name "Chabad Bologna Website"
          git config user.email "actions@users.noreply.github.com"
          git add data/shabbat.json
          git commit -m "Update weekly Shabbat information"
          git push
