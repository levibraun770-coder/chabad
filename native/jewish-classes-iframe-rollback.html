<script type="text/javascript">
(function () {
  var frame = document.getElementById("cob-github-frame");
  if (!frame) { return; }
  function resizeFrame(event) {
    if (event.origin !== "https://levibraun770-coder.github.io") { return; }
    if (event.source !== frame.contentWindow) { return; }
    var information = event.data;
    if (!information || information.type !== "cob-frame-height") { return; }
    var newHeight = Number(information.height);
    if (!isFinite(newHeight) || newHeight > 10000) { return; }
    if (newHeight > 200) { frame.style.height = Math.ceil(newHeight) + "px"; }
  }
  window.addEventListener("message", resizeFrame, false);
})();
</script>
