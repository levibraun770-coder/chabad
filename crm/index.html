<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8F173E">
  <meta name="description" content="Chabad Regional CRM - private operational CRM shell for Chabad of Bologna and Emilia-Romagna.">
  <title>Chabad Regional CRM</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <button id="backBtn" class="icon-btn hidden" type="button" aria-label="Back">←</button>
      <div class="brand">
        <div class="brand-title">Chabad Regional CRM</div>
        <div class="brand-subtitle">Emilia-Romagna</div>
      </div>
      <button id="moreBtn" class="icon-btn" type="button" aria-label="Settings">⋯</button>
    </header>
    <nav class="top-nav" aria-label="Main navigation">
      <button data-view="review" class="nav-btn active" type="button">Review</button>
      <button data-view="search" class="nav-btn" type="button">Search</button>
      <button data-view="chanukah" class="nav-btn" type="button">Chanukah</button>
      <button data-view="cities" class="nav-btn" type="button">Cities</button>
    </nav>
    <main id="main" tabindex="-1"></main>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>
  <input id="importInput" type="file" accept="application/json,.json" hidden>
  <script src="app.js" defer></script>
</body>
</html>
