px 0 12px}h3{margin:0;font-size:16px}.muted{color:var(--sub);font-size:14px}.lesson{background:var(--surface);border:1px solid var(--line);border-radius:17px;display:flex;align-items:center;gap:13px;padding:15px;margin:8px 0;width:100%;text-align:left;color:var(--ink)}.lesson .num{flex:none;width:43px;height:43px;display:grid;place-items:center;background:var(--soft);color:var(--green);font-size:15px;font-weight:800;border-radius:12px}.lesson .desc{flex:1;min-width:0}.lesson .desc p{margin:3px 0 0;font-size:13px;color:var(--sub)}.lesson .arrow{color:var(--green);font-size:21px}.bar{height:6px;background:var(--line);border-radius:10px;overflow:hidden;margin:13px 0 20px}.bar div{height:100%;background:var(--green);border-radius:10px;transition:width .2s}.back{background:none;border:0;color:var(--green);font-weight:750;padding:6px 0}.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;margin:13px 0}.phrase{font-size:30px;line-height:1.2;letter-spacing:-.6px;margin:15px 0;font-weight:750}.english{font-size:19px;color:var(--sub);margin:0 0 12px}.tip{font-size:14px;background:var(--soft);border-radius:12px;padding:12px;margin:15px 0}.choices{display:grid;gap:9px;margin:16px 0}.choice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:var(--ink);font-weight:600}.choice.good{border-color:var(--green);background:#e5f1e4}.choice.bad{border-color:var(--red);background:#f8e9e5}.choice:disabled{opacity:1;cursor:default}.feedback{margin:12px 0;font-size:15px;font-weight:650}.goodtext{color:var(--green)}.badtext{color:var(--red)}.actionrow{display:flex;gap:9px;margin-top:18px}.actionrow>*{flex:1}.speaker{border:0;color:var(--green);background:var(--soft);border-radius:12px;padding:11px 14px;font-weight:700}.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:9px 8px max(9px,env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10}.tabs button{color:var(--sub);border:0;background:transparent;width:120px;padding:5px 1px;font-size:12px;font-weight:650;display:grid;gap:3px;justify-items:center}.tabs button.active{color:var(--green)}.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--ink);margin:8px 0}.word{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.word div{flex:1}.word strong{display:block}.word small{color:var(--sub)}.word button{flex:none}.pill{display:inline-block;font-size:12px;font-weight:700;color:var(--green);background:var(--soft);border-radius:20px;padding:4px 10px}.mode{display:flex;gap:8px;margin:12px 0}.mode button{flex:1}.settings{border:0;background:transparent;color:var(--sub);font-size:13px;font-weight:700}.empty{text-align:center;padding:35px 12px;color:var(--sub)}.notice{font-size:12px;color:var(--sub);margin-top:12px}.line{height:1px;background:var(--line);margin:20px 0}.quizinput{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);color:var(--ink)}@media(min-width:700px){main{padding-top:35px}.hero{padding:30px}}@media(prefers-color-scheme:dark){:root{--bg:#1a211e;--surface:#232d27;--ink:#eef1e9;--sub:#aab7ae;--green:#a8d5b9;--soft:#34493c;--line:#3b493f;--red:#f0aaa0}.hero{background:#305c45}.hero .btn{color:#255b46}.btn{background:#a8d5b9;color:#16271d}.choice.good{background:#304a37}.choice.bad{background:#50322d}.btn.secondary{color:#c9e9d3}.hero .small{color:#c0d9c8}}
</style></head><body><main><header><div class="brand">italiano<i></i></div><button class="settings" onclick="show('settings')">Settings</button></header><div id="screen"></div></main><nav class="tabs" id="tabs"></nav><script>
const lessons=[
['Getting by','Greetings, courtesy and basic requests',[
['Buongiorno','Good morning / good day','Use with people you do not know well.'],['Come va?','How is it going?','Informal; formal: Come sta?'],['Non ho capito.','I didn’t understand.','A useful phrase at any level.'],['Può ripetere, per favore?','Could you repeat, please?','Può is polite and formal.'],['Parlo un po’ di italiano.','I speak a little Italian.','Un po’ means a little.'],['Come si dice in italiano?','How do you say it in Italian?','Use this to keep learning in real conversations.']]],
['People & introductions','Introduce yourself and get to know people',[
['Mi chiamo David.','My name is David.','Mi chiamo literally means I call myself.'],['Vivo a Bologna.','I live in Bologna.','Use a before a city.'],['Da dove vieni?','Where are you from?','Informal; formal: Da dove viene?'],['Da quanto tempo vivi qui?','How long have you lived here?','Da quanto tempo asks about duration.'],['Di cosa ti occupi?','What do you do for work?','A natural alternative to Che lavoro fai?'],['Mi fa piacere conoscerti.','It’s nice to meet you.','Informal; formal: conoscerLa.']]],
['Around Bologna','Transport, directions and getting around',[
['Dov’è la fermata dell’autobus?','Where is the bus stop?','Dov’è = dove è.'],['Devo andare in centro.','I need to go to the city centre.','Devo = I must / need to.'],['Quanto ci vuole?','How long does it take?','Works for travel and waiting times.'],['È lontano da qui?','Is it far from here?','Da qui = from here.'],['Scendo alla prossima fermata.','I’m getting off at the next stop.','Scendere = to get off.'],['Mi può indicare la strada?','Could you show me the way?','Polite request.']]],
['Shopping & services','Prices, supplies and getting things fixed',[
['Quanto costa?','How much does it cost?','Plural: Quanto costano?'],['Avete questo prodotto?','Do you have this product?','Avete is addressed to multiple people or a business.'],['Posso pagare con la carta?','Can I pay by card?','Con la carta = by card.'],['Mi serve una ricevuta.','I need a receipt.','Mi serve = I need.'],['Non funziona.','It doesn’t work.','Useful for equipment, Wi-Fi or appliances.'],['Quando può venire a ripararlo?','When can you come to fix it?','Ripararlo = fix it (masculine object).']]],
['Phone & WhatsApp','Natural messages and arranging meetings',[
['La chiamo per un’informazione.','I’m calling you for some information.','Formal La chiamo; informal Ti chiamo.'],['Possiamo sentirci domani?','Can we speak tomorrow?','Sentirci = get in touch / speak.'],['A che ora Le fa comodo?','What time works for you?','Formal Le; informal ti.'],['Le mando l’indirizzo.','I’ll send you the address.','Present tense can express a near future.'],['Mi faccia sapere.','Please let me know.','Informal: Fammi sapere.'],['Scusi per il ritardo.','Sorry for the delay.','Informal: Scusa.']]],
['Community & Shabbat','Explain Chabad and invite people naturally',[
['Mi occupo della comunità ebraica.','I work with the Jewish community.','Mi occupo di = I deal with / work with.'],['Organizziamo una cena venerdì sera.','We are organising a dinner on Friday evening.','Venerdì sera = Friday evening.'],['Ti va di venire?','Would you like to come?','Casual, friendly invitation.'],['Quante persone sarete?','How many people will you be?','Sarete = you (plural) will be.'],['La cena è su prenotazione.','Dinner requires a reservation.','Su prenotazione = by reservation.'],['Il cibo è kasher.','The food is kosher.','Kasher and kosher are both used in Italian.']]],
['Office & paperwork','Appointments, documents and bureaucracy',[
['Vorrei fissare un appuntamento.','I’d like to make an appointment.','Vorrei is a polite I would like.'],['Quali documenti devo portare?','Which documents do I need to bring?','Quali = which (plural).'],['Ho già presentato la domanda.','I have already submitted the application.','Già = already.'],['Mi manca un documento.','I’m missing a document.','Mi manca = I am missing.'],['Quando sarà pronto?','When will it be ready?','Sarà = will be.'],['Potrebbe mandarmi una conferma via email?','Could you send me confirmation by email?','Potrebbe is very polite.']]],
['Building relationships','Meetings, collaboration and follow-ups',[
['Vorrei parlarLe di un progetto.','I’d like to talk to you about a project.','Formal parlarLe; informal parlarti.'],['Possiamo incontrarci la settimana prossima?','Can we meet next week?','Incontrarci = meet each other.'],['Grazie per il Suo sostegno.','Thank you for your support.','Formal Suo; informal tuo.'],['Le spiego come funziona.','I’ll explain how it works.','Come funziona = how it works.'],['Sarebbe possibile collaborare?','Would it be possible to collaborate?','Sarebbe = would be.'],['Rimaniamo in contatto.','Let’s stay in touch.','Useful at the end of a meeting.']]],

['Yesterday & tomorrow','Talk about what happened and what is next',[

const all=lessons.flatMap((l,i)=>l[2].map((p,j)=>({id:i+'-'+j,it:p[0],en:p[1],tip:p[2],lesson:i})));let saved={done:[],words:{},days:[],speed:.85};try{let p=JSON.parse(localStorage.getItem('italiano-v1'));if(p&&Array.isArray(p.done)&&p.words&&Array.isArray(p.days))saved={...saved,...p}}catch(e){};let tab='home',session=null,answer=null,search='',storage=true;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function persist(){try{localStorage.setItem('italiano-v1',JSON.stringify(saved))}catch(e){storage=false}}function day(){let d=new Date(),s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(!saved.days.includes(s))saved.days.push(s)}function speak(id){let p=all.find(p=>p.id===id);if(!p||!('speechSynthesis'in window)){alert('Italian audio is not available in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(p.it);u.lang='it-IT';u.rate=Number(saved.speed);let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('it'));if(v)u.voice=v;speechSynthesis.speak(u)}function shuffle(a){return [...a].map(x=>({x,k:Math.random()})).sort((a,b)=>a.k-b.k).map(o=>o.x)}function mark(p,ok){let w=saved.words[p.id]||{hits:0,misses:0,due:0};if(ok){w.hits++;w.due=Date.now()+Math.min(7,Math.pow(2,w.hits-1))*86400000}else{w.misses++;w.hits=0;w.due=Date.now()}saved.words[p.id]=w;day();persist()}function due(){return all.filter(p=>saved.words[p.id]&&saved.words[p.id].due<=Date.now())}function mastered(){return Object.values(saved.words).filter(w=>w.hits>=2).length}function start(i){session={kind:'learn',i,list:all.filter(p=>p.lesson===i),pos:0,correct:0};answer=null;render()}function review(){let list=due();if(!list.length)list=all.filter(p=>saved.words[p.id]);if(!list.length){start(0);return}session={kind:'review',list:shuffle(list).slice(0,15),pos:0,correct:0};answer=null;render()}function practice(i,kind='quiz'){let list=i==null?all.filter(p=>saved.words[p.id]):all.filter(p=>p.lesson===i);if(!list.length)list=all.filter(p=>p.lesson===0);session={kind,list:shuffle(list).slice(0,10),i,pos:0,correct:0};answer=null;render()}function show(t){tab=t;session=null;answer=null;search='';render();window.scrollTo(0,0)}function advance(){let s=session;if(s.pos+1<s.list.length){s.pos++;answer=null;render();return}if(s.kind==='learn'&&s.i!=null){if(!saved.done.includes(s.i))saved.done.push(s.i);for(const p of s.list){if(!saved.words[p.id])saved.words[p.id]={hits:0,misses:0,due:Date.now()}}day();persist();s.kind='learnEnd'}else{s.kind='end'}render()}function check(x){if(answer!==null)return;let p=session.list[session.pos],right=x===p.id;answer={right,x};if(right)session.correct++;mark(p,right);render()}function flip(){if(answer!==null)return;answer={reveal:true};render()}function rate(ok){if(!answer?.reveal)return;mark(session.list[session.pos],ok);if(ok)session.correct++;advance()}function normalize(x){return x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}function typed(){if(answer!==null)return;let p=session.list[session.pos],v=$('typed').value;let right=normalize(v)===normalize(p.it);answer={right,x:v};if(right)session.correct++;mark(p,right);render()}
const icons={home:'<path d="M3 10 12 3l9 7v10H3z"/><path d="M9 20v-7h6v7"/>',learn:'<path d="M4 4h7v16H4zM13 4h7v16h-7z"/>',review:'<path d="M20 11a8 8 0 1 0-3 7"/><path d="M20 4v7h-7"/>',words:'<path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/>'};function rows(){return lessons.map((l,i)=>`<button class="lesson" onclick="start(${i})"><span class="num">${saved.done.includes(i)?'✓':String(i+1).padStart(2,'0')}</span><span class="desc"><h3>${esc(l[0])}</h3><p>${esc(l[1])}</p></span><span class="arrow">›</span></button>`).join('')};function nav(){ $('tabs').innerHTML=Object.entries({home:'Today',learn:'Lessons',review:'Review',words:'Phrases'}).map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="show('${k}')"><svg viewBox="0 0 24 24">${icons[k]}</svg>${v}${k==='review'&&due().length?' · '+due().length:''}</button>`).join('')}
function render(){nav();let h='';if(session){let s=session,p=s.list[s.pos],done=s.kind==='end'||s.kind==='learnEnd';if(done){h=`<button class="back" onclick="show('home')">‹ Today</button><div class="panel"><span class="pill">Session complete</span><h2>${s.kind==='learnEnd'?'Ben fatto!':'Practice finished'}</h2><p>${s.kind==='learnEnd'?'You’ve studied '+s.list.length+' useful phrases. Now try recalling them without looking.':s.correct+' of '+s.list.length+' correct. Missed phrases are ready for review.'}</p><button class="btn wide" onclick="${s.kind==='learnEnd'?'practice('+s.i+')':"show('home')"}">${s.kind==='learnEnd'?'Test yourself':'Back to today'}</button></div>`}else{h=`<button class="back" onclick="show('${s.kind==='learn'?'learn':'review'}')">‹ Back</button><div class="small" style="margin-top:14px">${s.kind==='learn'?esc(lessons[s.i][0]):s.kind==='review'?'Flashcard review':s.kind==='type'?'Build the sentence':s.kind==='listen'?'Listening practice':'Quick quiz'} · ${s.pos+1} / ${s.list.length}</div><div class="bar"><div style="width:${100*s.pos/s.list.length}%"></div></div>`;if(s.kind==='learn'){h+=`<div class="panel"><span class="small">Italian</span><div class="phrase">${esc(p.it)}</div><div class="english">${esc(p.en)}</div><button class="speaker" onclick="speak('${p.id}')">▶ Listen</button><div class="tip">${esc(p.tip)}</div><button class="btn wide" onclick="advance()">${s.pos===s.list.length-1?'Finish lesson':'Next phrase'}</button></div>`}else if(s.kind==='review'){h+=`<div class="panel"><span class="small">Say it in Italian</span><div class="phrase">${esc(p.en)}</div>${answer?`<div class="line"></div><div class="phrase">${esc(p.it)}</div><button class="speaker" onclick="speak('${p.id}')">▶ Listen</button><div class="actionrow"><button class="btn secondary" onclick="rate(false)">Still learning</button><button class="btn" onclick="rate(true)">I knew it</button></div>`:`<button class="btn wide" onclick="flip()">Reveal answer</button>`}</div>`}else if(s.kind==='type'){h+=`<div class="panel"><span class="small">Translate into Italian</span><div class="phrase">${esc(p.en)}</div>${answer?`<p>${esc(answer.x)}</p><p class="feedback ${answer.right?'goodtext':'badtext'}">${answer.right?'Correct!':'Expected phrase: '+esc(p.it)}</p><button class="btn wide" onclick="advance()">Next</button>`:`<form onsubmit="event.preventDefault();typed()"><input id="typed" class="quizinput" required placeholder="Type in Italian…" autocomplete="off"><button class="btn wide" style="margin-top:12px">Check</button></form>`}</div>`}else{if(!s.options||s.options.pos!==s.pos){s.options={pos:s.pos,list:shuffle([p,...shuffle(all.filter(x=>x.id!==p.id&&x.en!==p.en)).slice(0,3)])}}h+=`<div class="panel"><span class="small">${s.kind==='listen'?'Listen and choose the meaning':'Choose the meaning'}</span>${s.kind==='listen'&&!answer?`<p><button class="speaker" onclick="speak('${p.id}')">▶ Play Italian</button></p>`:`<div class="phrase">${esc(p.it)}</div><button class="speaker" onclick="speak('${p.id}')">▶ Listen</button>`}<div class="choices">${s.options.list.map(o=>`<button class="choice ${answer?o.id===p.id?'good':o.id===answer.x?'bad':'':''}" ${answer?'disabled':''} onclick="check('${o.id}')">${esc(o.en)}</button>`).join('')}</div>${answer?`<div class="feedback ${answer.right?'goodtext':'badtext'}">${answer.right?'Correct!':'Not quite. '+esc(p.en)}</div><div class="muted">${esc(p.tip)}</div><button class="btn wide" style="margin-top:14px" onclick="advance()">Next</button>`:''}</div>`}}}else if(tab==='home'){let i=lessons.findIndex((_,i)=>!saved.done.includes(i));if(i<0)i=0;h=`<div class="hero"><div class="small">Your daily Italian</div><h1>Speak Italian in real life.</h1><p>Useful Italian for Bologna, one short lesson at a time.</p><button class="btn" onclick="start(${i})">${saved.done.length?'Continue learning':'Start your first lesson'} →</button></div><div class="stats"><div class="stat"><strong>${saved.done.length}/10</strong><span>Lessons studied</span></div><div class="stat"><strong>${mastered()}</strong><span>Practiced well</span></div><div class="stat"><strong>${saved.days.length}</strong><span>Days active</span></div></div><h2>Today's practice</h2><button class="lesson" onclick="review()"><span class="num">${due().length||'↻'}</span><span class="desc"><h3>Review phrases</h3><p>${due().length?due().length+' ready to review':'Recall what you’ve learned'}</p></span><span class="arrow">›</span></button><button class="lesson" onclick="practice(null,'listen')"><span class="num">▶</span><span class="desc"><h3>Train your ear</h3><p>Listen and choose the meaning</p></span><span class="arrow">›</span></button><button class="lesson" onclick="practice(null,'type')"><span class="num">Aa</span><span class="desc"><h3>Build a sentence</h3><p>Translate a useful phrase</p></span><span class="arrow">›</span></button><h2>Your learning path</h2>${rows()}` }else if(tab==='learn'){h=`<h2>Learn Italian</h2><p class="muted">10 short lessons · 60 practical phrases</p>${rows()}`}else if(tab==='review'){h=`<h2>Practice & review</h2><div class="panel"><span class="small">Ready to review</span><div class="phrase">${due().length} phrases</div><p class="muted">Correct answers are spaced out over several days. Missed phrases come back sooner.</p><button class="btn wide" onclick="review()">${due().length?'Start review':'Practice flashcards'}</button></div><button class="lesson" onclick="practice(null,'quiz')"><span class="num">✓</span><span class="desc"><h3>Quick quiz</h3><p>Choose the right translation</p></span><span class="arrow">›</span></button><button class="lesson" onclick="practice(null,'listen')"><span class="num">▶</span><span class="desc"><h3>Listening</h3><p>Understand spoken Italian</p></span><span class="arrow">›</span></button><button class="lesson" onclick="practice(null,'type')"><span class="num">Aa</span><span class="desc"><h3>Sentence practice</h3><p>Write the Italian phrase</p></span><span class="arrow">›</span></button>`}else if(tab==='words'){h=`<h2>Phrasebook</h2><p class="muted">Find the right phrase when you need it.</p><input class="search" placeholder="Search Italian or English…" value="${esc(search)}" oninput="search=this.value;filterWords()"><div id="wordlist"></div>`}else{h=`<h2>Settings</h2><div class="panel"><h3>Italian audio speed</h3><p class="muted">Choose how slowly the phrases are read.</p><select class="search" onchange="saved.speed=Number(this.value);persist()"><option value=".65" ${saved.speed===.65?'selected':''}>Slow</option><option value=".85" ${saved.speed===.85?'selected':''}>Medium</option><option value="1" ${saved.speed===1?'selected':''}>Natural</option></select><p class="notice">Audio uses your browser's Italian text-to-speech voice. Availability varies by device.</p><div class="line"></div><h3>Progress</h3><p class="muted">Saved locally in this browser where supported; not synced between devices.</p><button class="btn secondary" onclick="if(confirm('Reset all learning progress?')){saved={done:[],words:{},days:[],speed:.85};persist();render()}">Reset progress</button></div>`}$('screen').innerHTML=h;if(tab==='words'&&!session)filterWords();if(!storage)$('screen').insertAdjacentHTML('beforeend','<p class="notice">This browser does not allow local progress saving.</p>')}
function filterWords(){let q=search.toLowerCase().trim();$('wordlist').innerHTML=all.filter(p=>(p.it+' '+p.en).toLowerCase().includes(q)).map(p=>`<div class="word"><div><strong>${esc(p.it)}</strong><small>${esc(p.en)}</small></div><button class="speaker" aria-label="Listen" onclick="speak('${p.id}')">▶</button></div>`).join('')||'<div class="empty">No matching phrases.</div>'}render();
</script></body></html>
